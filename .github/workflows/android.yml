name: Build release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Signed release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install required Android packages
        run: |
          sdkmanager \
            'platforms;android-35' \
            'build-tools;35.0.0'

      # This repository intentionally uses the Gradle installation provided by CI.
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Temporary signing identity: new each run; not suitable for in-place updates.
      # The certificate has a long validity so downloaded APKs do not expire in a day.
      - name: Generate temporary signing key
        run: |
          set -euo pipefail

          keystore="$RUNNER_TEMP/auto-optimiser-ci.p12"
          password="$(openssl rand -hex 24)"

          echo "::add-mask::$password"

          keytool -genkeypair -noprompt \
            -storetype PKCS12 \
            -keystore "$keystore" \
            -alias autooptimiser-ci \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$password" \
            -keypass "$password" \
            -dname 'CN=Auto Optimiser Temporary Build'

          {
            printf 'ORG_GRADLE_PROJECT_releaseStoreFile=%s\n' "$keystore"
            printf 'ORG_GRADLE_PROJECT_releaseStorePassword=%s\n' "$password"
            printf 'ORG_GRADLE_PROJECT_releaseKeyAlias=autooptimiser-ci\n'
            printf 'ORG_GRADLE_PROJECT_releaseKeyPassword=%s\n' "$password"
          } >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: |
          gradle \
            --no-daemon \
            --console=plain \
            --stacktrace \
            :app:assembleRelease

      - name: Verify APK signature
        run: |
          set -euo pipefail

          apk='app/build/outputs/apk/release/app-release.apk'

          test -s "$apk"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"

      - name: Upload APK for download
        uses: actions/upload-artifact@v4
        with:
          name: Auto-Optimiser-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/auto-optimiser-ci.p12"
