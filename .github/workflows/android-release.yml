name: Android Release APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build signed release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build release APK
        run: gradle --no-daemon assembleRelease
      - name: Generate temporary release keystore
        run: |
          keytool -genkeypair \
            -keystore temp-release.jks \
            -storepass autooptimizer-temp \
            -keypass autooptimizer-temp \
            -alias autooptimizer \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -dname "CN=Auto Optimizer, OU=Open Source, O=mkr-infinity, L=NA, ST=NA, C=IN"
      - name: Sign release APK
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED="app/build/outputs/apk/release/AutoOptimizer-v0.1.0-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" sign \
            --ks temp-release.jks \
            --ks-pass pass:autooptimizer-temp \
            --key-pass pass:autooptimizer-temp \
            --ks-key-alias autooptimizer \
            --out "$SIGNED" \
            "$APK"
          "$APKSIGNER" verify --verbose "$SIGNED"
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoOptimizer-v0.1.0-release
          path: app/build/outputs/apk/release/AutoOptimizer-v0.1.0-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: app/build/outputs/apk/release/AutoOptimizer-v0.1.0-release.apk
